# Accuracy matrix with 3 base domains for the prior-work baselines: same settings as
# core50_domains_baselines.yaml, on the 8-session stream core50_b3.
out: results/domains
datasets:
- core50_b3
seeds:
- 0
- 1
- 2
runs:
- method: cara
  tag: carat_l0.2
  set:
    method.variant: threshold
    method.lam: 0.2
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
    domain_eval:
      n: 640
    device: cuda
- method: cara
  tag: caract_l0.3
  set:
    method.variant: cumulative
    method.lam: 0.3
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
    domain_eval:
      n: 640
    device: cuda
- method: d3a
  tag: d3a_w4_a1
  set:
    method.window: 4
    method.alpha: 1
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
    domain_eval:
      n: 640
    device: cuda
- method: periodic
  tag: replay_p16
  set:
    method.period: 16
    learner.replay:
      size: 256
      frac: 0.5
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
    domain_eval:
      n: 640
    device: cuda
