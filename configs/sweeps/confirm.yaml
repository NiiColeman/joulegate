# Held-out confirmation picks (E3). Rule, fixed before any seed 3-5 run and applied to dev results only: per family,
# the setting with the lowest mean dev error among settings using at most 10 % of update-every-step
# (periodic_p1) adaptation energy on every dev stream, else at most 25 %, else none. Plus frozen and periodic_p1.
# Seeds 3-5, analytic energy; nothing is selected on these runs.
# Backbone patchmixer: dev streams synthetic_dev, ettm1_dev (results/dev).
out: results/confirm
datasets:
- synthetic
- ettm1
- electricity
- solar
seeds:
- 3
- 4
- 5
runs:
- method: frozen
  tag: frozen
  set: {}
- method: periodic
  tag: periodic_p1
  set:
    method.period: 1
- method: periodic
  tag: periodic_p16
  set:
    method.period: 16
- method: drift
  tag: drift_t0.8
  set:
    method.tau: 0.8
- method: vou
  tag: vou_l10
  set:
    method.lam: 10
- method: vou_gated
  tag: vougerr_t0.5_l1
  set:
    method.gate: error
    method.tau: 0.5
    method.lam: 1
- method: vou_gated
  tag: vougin_k5_l1
  set:
    method.gate: input
    method.kappa: 5
    method.lam: 1
- method: cara
  tag: carat_l10
  set:
    method.variant: threshold
    method.lam: 10
- method: cara
  tag: caract_l0.0001
  set:
    method.variant: cumulative
    method.lam: 0.0001
- method: upf
  tag: upf_l100
  set:
    method.lam: 100
- method: d3a
  tag: d3a_w4_a1
  set:
    method.window: 4
    method.alpha: 1
