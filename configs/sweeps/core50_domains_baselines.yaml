# CORe50 accuracy matrix (as core50_domains.yaml) for the prior-work baselines: each family's best
# setting on CORe50 online accuracy within 10 % of always-update energy (25 % if none), from
# results/baselines. UPF has no setting within 25 % (its cheapest uses 51 %), so it has no run here.
out: results/domains
datasets:
- core50
seeds:
- 0
- 1
- 2
runs:
- method: cara
  tag: carat_l0.2
  set:
    method.variant: threshold
    method.lam: 0.2
    domain_eval:
      n: 640
    device: cuda
- method: cara
  tag: caract_l0.3
  set:
    method.variant: cumulative
    method.lam: 0.3
    domain_eval:
      n: 640
    device: cuda
- method: d3a
  tag: d3a_w4_a1
  set:
    method.window: 4
    method.alpha: 1
    domain_eval:
      n: 640
    device: cuda
- method: periodic
  tag: replay_p16
  set:
    method.period: 16
    learner.replay:
      size: 256
      frac: 0.5
    domain_eval:
      n: 640
    device: cuda
