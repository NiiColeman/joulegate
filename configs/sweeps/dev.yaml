# Dev sweep used only to design policies and pick grids (dev streams are disjoint from eval).
out: results/dev
datasets: [synthetic_dev, ettm1_dev]
seeds: [0]
runs:
- {method: frozen, tag: frozen}
- method: periodic
  tag: periodic_p1
  set: {method.period: 1}
- method: periodic
  tag: periodic_p2
  set: {method.period: 2}
- method: periodic
  tag: periodic_p4
  set: {method.period: 4}
- method: periodic
  tag: periodic_p8
  set: {method.period: 8}
- method: periodic
  tag: periodic_p16
  set: {method.period: 16}
- method: drift
  tag: drift_t0.0
  set: {method.tau: 0.0}
- method: drift
  tag: drift_t0.05
  set: {method.tau: 0.05}
- method: drift
  tag: drift_t0.2
  set: {method.tau: 0.2}
- method: drift
  tag: drift_t0.8
  set: {method.tau: 0.8}
- method: vou
  tag: vou_l0.01
  set: {method.lam: 0.01}
- method: vou
  tag: vou_l0.1
  set: {method.lam: 0.1}
- method: vou
  tag: vou_l1
  set: {method.lam: 1}
- method: vou
  tag: vou_l10
  set: {method.lam: 10}
- method: vou
  tag: vou_l100
  set: {method.lam: 100}
- method: vou
  tag: vou_l1000
  set: {method.lam: 1000}
- method: vou_err
  tag: vouerr_l2
  set: {method.lam: 2}
- method: vou_err
  tag: vouerr_l8
  set: {method.lam: 8}
- method: vou_err
  tag: vouerr_l32
  set: {method.lam: 32}
