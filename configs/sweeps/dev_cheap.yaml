  tag: vougerr_t0.5_l1
  set: {method.gate: error, method.tau: 0.5, method.lam: 1}
- method: vou_gated
  tag: vougin_k3_l3
  set: {method.gate: input, method.kappa: 3, method.lam: 3}
- method: vou_gated
  tag: vougin_k3_l10
  set: {method.gate: input, method.kappa: 3, method.lam: 10}
- method: vou_gated
