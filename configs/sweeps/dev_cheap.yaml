# Dev sweep for shift-gated VoU (dev streams only, as in dev.yaml): input-gated (kappa x lam)
# and error-gated (tau x lam); lam 3-30 added after the second dev sweep reached no 5-10 %
# budgets. Residual VoU was dropped after its first dev sweep (see methods/vou_resid.py).
# Compare against dev.yaml's periodic / drift / vou runs in results/dev.
out: results/dev
datasets: [synthetic_dev, ettm1_dev]
seeds: [0]
runs:
- method: vou_gated
  tag: vougin_k3_l0.01
  set: {method.gate: input, method.kappa: 3, method.lam: 0.01}
- method: vou_gated
  tag: vougin_k3_l0.1
  set: {method.gate: input, method.kappa: 3, method.lam: 0.1}
- method: vou_gated
  tag: vougin_k3_l1
  set: {method.gate: input, method.kappa: 3, method.lam: 1}
- method: vou_gated
  tag: vougin_k5_l0.01
