- method: vou_gated
  tag: vougin_k5_l1
  set: {method.gate: input, method.kappa: 5, method.lam: 1}
- method: vou_gated
  tag: vougin_k8_l0.01
  set: {method.gate: input, method.kappa: 8, method.lam: 0.01}
