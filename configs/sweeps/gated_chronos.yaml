# gated evaluation grid for the chronos backbone, chosen on the dev streams (dev_chronos.yaml, results/dev_chronos):
# per family, settings spanning 3-100 % of always-update energy on dev, near-identical neighbours dropped,
# one setting near the bottom of each VoU family where dev had one. 3 seeds, analytic energy, on GPU.
out: results/chronos
backbone: chronos
datasets:
- synthetic
- ettm1
- electricity
- solar
seeds:
- 0
- 1
- 2
runs:
- method: vou_gated
  tag: vougerr_t0.05_l1
  set:
    method.gate: error
    method.tau: 0.05
    method.lam: 1
    device: cuda
