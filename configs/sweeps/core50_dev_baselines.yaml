# Dev sweep for the prior-work baselines (CARA-T/CT, UPF, D3A) on the dev streams only; evaluation
# grids are picked from it by pick_grid.py. lam is a price in this backbone's analytic joules, so a
# wide log grid is tried first; a second pass may add values in gaps (documented here when it does).
# Second pass: no setting at 3-15 % of always-update energy on the dev streams, so added cara threshold/cumulative lam 0.2 and 0.5, upf lam 0.02 and 0.05.
# Third pass (CORe50 only): carat 0.15, caract 0.3 and 0.4, upf 0.07 and 0.085; the second pass still left CARA-CT (21 % -> 2.4 % across lam 0.2 -> 0.5) and UPF (27.5 % -> 1.4 % across lam 0.05 -> 0.1) with nothing at 3-15 % of always-update energy. Last pass; gaps left after it are reported as-is.
out: results/dev
datasets:
- core50_dev
seeds:
- 0
runs:
