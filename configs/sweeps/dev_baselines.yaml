- method: upf
  tag: upf_l10
  set:
    method.lam: 10
- method: upf
  tag: upf_l100
  set:
    method.lam: 100
- method: upf
  tag: upf_l1000
  set:
    method.lam: 1000
- method: d3a
  tag: d3a_w4_a1
  set:
    method.window: 4
    method.alpha: 1
- method: d3a
  tag: d3a_w4_a1.96
  set:
    method.window: 4
    method.alpha: 1.96
- method: d3a
  tag: d3a_w4_a3
  set:
