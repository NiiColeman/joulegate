    method.lam: 0.001
- method: cara
  tag: caract_l0.01
  set:
    method.variant: cumulative
    method.lam: 0.01
- method: cara
  tag: caract_l0.1
  set:
    method.variant: cumulative
    method.lam: 0.1
- method: cara
  tag: caract_l1
  set:
    method.variant: cumulative
    method.lam: 1
- method: cara
  tag: caract_l10
  set:
    method.variant: cumulative
    method.lam: 10
- method: cara
  tag: caract_l100
  set:
    method.variant: cumulative
    method.lam: 100
- method: cara
  tag: caract_l1000
  set:
    method.variant: cumulative
    method.lam: 1000
- method: upf
  tag: upf_l0.0001
  set:
    method.lam: 0.0001
- method: upf
  tag: upf_l0.001
  set:
    method.lam: 0.001
- method: upf
