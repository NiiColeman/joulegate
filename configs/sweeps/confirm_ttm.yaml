# Held-out confirmation picks (E3). Rule, fixed before any seed 3-5 run and applied to dev results only: per family,
# the setting with the lowest mean dev error among settings using at most 10 % of update-every-step
# (periodic_p1) adaptation energy on every dev stream, else at most 25 %, else none. Plus frozen and periodic_p1.
# Seeds 3-5, analytic energy; nothing is selected on these runs.
# Backbone ttm: dev streams synthetic_dev, ettm1_dev (results/dev_ttm).
out: results/confirm_ttm
backbone: ttm
datasets:
- synthetic
- ettm1
- electricity
- solar
seeds:
- 3
- 4
- 5
runs:
- method: frozen
  tag: frozen
  set:
    device: cuda
- method: periodic
  tag: periodic_p1
  set:
    method.period: 1
    device: cuda
- method: periodic
  tag: periodic_p16
  set:
    method.period: 16
    device: cuda
- method: drift
  tag: drift_t0.8
  set:
    method.tau: 0.8
    device: cuda
- method: vou
  tag: vou_l2
  set:
    method.lam: 2
    device: cuda
- method: vou_gated
  tag: vougerr_t0.2_l3
  set:
    method.gate: error
    method.tau: 0.2
    method.lam: 3
    device: cuda
- method: vou_gated
  tag: vougin_k5_l3
  set:
    method.gate: input
    method.kappa: 5
    method.lam: 3
    device: cuda
- method: cara
  tag: carat_l1000
  set:
    method.variant: threshold
    method.lam: 1000
    device: cuda
- method: cara
  tag: caract_l0.0001
  set:
    method.variant: cumulative
    method.lam: 0.0001
    device: cuda
- method: upf
  tag: upf_l1000
  set:
    method.lam: 1000
    device: cuda
- method: d3a
  tag: d3a_w4_a3
  set:
    method.window: 4
    method.alpha: 3
    device: cuda
