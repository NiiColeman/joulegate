# Measured CPU runs of the CORe50 evaluation grid (configs/sweeps/core50.yaml), 1 seed.
# Run with EXTRA_SET="threads=8 energy.max_seconds=7200" (a 1-thread vision run outlasts 3600 s).
out: results/measured_vision
datasets: [core50]
seeds: [0]
runs:
- {method: frozen, tag: frozen}
- method: periodic
  tag: periodic_p1
  set: {method.period: 1}
- method: periodic
  tag: periodic_p2
  set: {method.period: 2}
- method: periodic
  tag: periodic_p4
  set: {method.period: 4}
- method: periodic
  tag: periodic_p8
  set: {method.period: 8}
- method: periodic
  tag: periodic_p16
  set: {method.period: 16}
- method: periodic
  tag: periodic_p32
  set: {method.period: 32}
- method: drift
  tag: drift_t0.0
  set: {method.tau: 0.0}
- method: drift
  tag: drift_t0.05
  set: {method.tau: 0.05}
- method: drift
  tag: drift_t0.1
  set: {method.tau: 0.1}
- method: drift
  tag: drift_t0.2
  set: {method.tau: 0.2}
- method: drift
  tag: drift_t0.4
  set: {method.tau: 0.4}
- method: vou
