# main evaluation grid for the ttm backbone, chosen on the dev streams (dev_ttm.yaml, results/dev_ttm):
# per family, settings spanning 3-100 % of always-update energy on dev, near-identical neighbours dropped,
# one setting near the bottom of each VoU family where dev had one. 3 seeds, analytic energy, on GPU.
out: results/ttm
backbone: ttm
datasets:
- synthetic
- ettm1
- electricity
- solar
seeds:
- 0
- 1
- 2
runs:
- method: frozen
  tag: frozen
  set:
    device: cuda
- method: periodic
  tag: periodic_p1
  set:
    method.period: 1
    device: cuda
- method: periodic
  tag: periodic_p2
  set:
    method.period: 2
    device: cuda
- method: periodic
  tag: periodic_p4
  set:
    method.period: 4
    device: cuda
- method: periodic
  tag: periodic_p8
  set:
    method.period: 8
    device: cuda
- method: periodic
  tag: periodic_p16
  set:
    method.period: 16
    device: cuda
- method: drift
  tag: drift_t0.0
  set:
    method.tau: 0.0
    device: cuda
- method: drift
  tag: drift_t0.05
  set:
    method.tau: 0.05
    device: cuda
- method: drift
  tag: drift_t0.2
  set:
    method.tau: 0.2
    device: cuda
- method: drift
  tag: drift_t0.8
  set:
    method.tau: 0.8
    device: cuda
- method: vou
  tag: vou_l0.01
  set:
    method.lam: 0.01
    device: cuda
- method: vou
  tag: vou_l0.1
  set:
    method.lam: 0.1
    device: cuda
- method: vou
  tag: vou_l0.3
  set:
    method.lam: 0.3
    device: cuda
- method: vou
  tag: vou_l1
  set:
    method.lam: 1
    device: cuda
- method: vou
  tag: vou_l2
  set:
    method.lam: 2
    device: cuda
- method: vou
  tag: vou_l3
  set:
    method.lam: 3
    device: cuda
- method: vou
  tag: vou_l5
  set:
    method.lam: 5
    device: cuda
