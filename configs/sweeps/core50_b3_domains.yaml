# Accuracy matrix with 3 base domains (sessions 1-3; pretrain_vision.py --base 1 2 3 --suffix _b3):
# same policies and settings as core50_domains.yaml, on the 8-session stream core50_b3.
out: results/domains
datasets:
- core50_b3
seeds:
- 0
- 1
- 2
runs:
- method: frozen
  tag: frozen
  set:
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: periodic
  tag: periodic_p1
  set:
    method.period: 1
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: periodic
  tag: periodic_p16
  set:
    method.period: 16
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: drift
  tag: drift_t0.4
  set:
    method.tau: 0.4
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: vou
  tag: vou_l5
  set:
    method.lam: 5
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: vou_gated
  tag: vougerr_t0.05_l10
  set:
    method.gate: error
    method.tau: 0.05
    method.lam: 10
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
- method: vou_gated
  tag: vougin_k5_l5
  set:
    method.gate: input
    method.kappa: 5
    method.lam: 5
    domain_eval:
      n: 640
    device: cuda
    checkpoint: checkpoints/vit_tiny_core50_b3.pt
    retention: checkpoints/vit_tiny_retention_b3.npz
