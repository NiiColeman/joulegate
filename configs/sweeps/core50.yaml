# CORe50 evaluation (analytic energy), 3 seeds, chosen on the dev stream (core50_dev.yaml) by the plan's
# rule: per family, settings between 3 % and 100 % of always-update energy, dropping neighbours with
# near-identical update counts. Dropped: drift tau 0.8 (0.8 %); vou lam 0.001 and 0.1 (same updates as
# 0.01) and lam >= 100 (< 2 %); lam 10 (~1-2 %) is kept despite the 3 % rule so
# every VoU family has a setting under the 5 % budget (final review); gated lam 100 (~1 %).
out: results/main
datasets: [core50]
seeds: [0, 1, 2]
runs:
- {method: frozen, tag: frozen}
- method: periodic
  tag: periodic_p1
  set: {method.period: 1}
- method: periodic
  tag: periodic_p2
  set: {method.period: 2}
- method: periodic
  tag: periodic_p4
  set: {method.period: 4}
- method: periodic
  tag: periodic_p8
  set: {method.period: 8}
- method: periodic
  tag: periodic_p16
  set: {method.period: 16}
- method: periodic
  tag: periodic_p32
  set: {method.period: 32}
- method: drift
  tag: drift_t0.0
  set: {method.tau: 0.0}
- method: drift
  tag: drift_t0.05
  set: {method.tau: 0.05}
- method: drift
  tag: drift_t0.1
  set: {method.tau: 0.1}
- method: drift
  tag: drift_t0.2
  set: {method.tau: 0.2}
- method: drift
  tag: drift_t0.4
  set: {method.tau: 0.4}
- method: vou
  tag: vou_l0.01
  set: {method.lam: 0.01}
- method: vou
  tag: vou_l1
  set: {method.lam: 1}
- method: vou
  tag: vou_l2
  set: {method.lam: 2}
- method: vou
  tag: vou_l3
  set: {method.lam: 3}
- method: vou
  tag: vou_l5
  set: {method.lam: 5}
- method: vou
  tag: vou_l10
  set: {method.lam: 10}
- method: vou_gated
  tag: vougerr_t0.05_l0.01
  set: {method.gate: error, method.tau: 0.05, method.lam: 0.01}
- method: vou_gated
  tag: vougerr_t0.05_l1
  set: {method.gate: error, method.tau: 0.05, method.lam: 1}
- method: vou_gated
  tag: vougerr_t0.05_l2
  set: {method.gate: error, method.tau: 0.05, method.lam: 2}
- method: vou_gated
  tag: vougerr_t0.05_l3
  set: {method.gate: error, method.tau: 0.05, method.lam: 3}
- method: vou_gated
  tag: vougerr_t0.05_l5
  set: {method.gate: error, method.tau: 0.05, method.lam: 5}
- method: vou_gated
  tag: vougerr_t0.05_l10
  set: {method.gate: error, method.tau: 0.05, method.lam: 10}
- method: vou_gated
  tag: vougerr_t0.2_l0.01
  set: {method.gate: error, method.tau: 0.2, method.lam: 0.01}
- method: vou_gated
  tag: vougerr_t0.2_l1
  set: {method.gate: error, method.tau: 0.2, method.lam: 1}
- method: vou_gated
  tag: vougerr_t0.2_l2
  set: {method.gate: error, method.tau: 0.2, method.lam: 2}
- method: vou_gated
  tag: vougerr_t0.2_l3
  set: {method.gate: error, method.tau: 0.2, method.lam: 3}
- method: vou_gated
  tag: vougerr_t0.2_l5
  set: {method.gate: error, method.tau: 0.2, method.lam: 5}
- method: vou_gated
  tag: vougerr_t0.2_l10
  set: {method.gate: error, method.tau: 0.2, method.lam: 10}
- method: vou_gated
  tag: vougin_k3_l0.01
