# Dev sweep for the ttm backbone (dev streams only; grids for main_ttm / gated_ttm are chosen here):
# dev.yaml + dev_cheap.yaml runs, plus lam 0.001 / 10000 (VoU) and 100 / 1000 (gated), since lam is a
# price in this backbone's analytic joules and its useful range is not known in advance. On GPU.
# Second pass (after the first dev results left gaps between lam settings): VoU lam [0.3, 2, 3, 5], gated lam [5].
out: results/dev_ttm
backbone: ttm
datasets:
- synthetic_dev
- ettm1_dev
seeds:
- 0
runs:
- method: frozen
  tag: frozen
  set:
    device: cuda
- method: periodic
  tag: periodic_p1
  set:
    method.period: 1
    device: cuda
