# CORe50 evaluation stream with 3 base domains: the 8 target sessions (never seen in fine-tuning), second half of every
# object-session video's kept frames. Fine-tuning used sessions 1, 2 and 3 (pretrain_vision.py --base 1 2 3).
task: vision
root: data/core50
sessions: [7, 4, 10, 9, 5, 11, 6, 8]
half: second
n_steps: 800
batch: 32
seed: 0
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]
